name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag and VERSION
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match VERSION ($version). Update VERSION, Main.RewiredVersion and bundleVersion first."
            exit 1
          fi

  engine_tests:
    name: Engine tests
    uses: ./.github/workflows/engine-harness.yml

  regression:
    name: Regression suites
    uses: ./.github/workflows/simulation-regression.yml

  build:
    name: Build ${{ matrix.label }}
    needs: [version, engine_tests, regression]
    runs-on: [self-hosted, trusted]
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            label: Windows x64
            packageName: DLSRewired-Windows-x64
          - targetPlatform: StandaloneLinux64
            label: Linux x86_64
            packageName: DLSRewired-Linux-x86_64

    steps:
      - name: Restore workspace ownership
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Self-hosted workspaces persist between jobs; fix files left by an earlier Unity container.
          work="$(readlink -f "$RUNNER_WORKSPACE/..")"
          docker run --rm -v "$work:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keep Unity's Library folder between jobs on this runner instead of
          # restoring it from the GitHub cache; the next step removes everything else.
          clean: false

      - name: Remove untracked files except Unity Library
        shell: bash
        run: git clean -ffdx -e /Library

      - name: Verify Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: DLSRewired
          buildsPath: build

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          build_dir="build/${{ matrix.targetPlatform }}"
          if [ ! -d "$build_dir" ]; then
            echo "::error::Expected build directory not found: $build_dir"
            find build -maxdepth 3 -type f -print || true
            exit 1
          fi
          # tar keeps the Linux executable bit; the publish job turns it into the release zip.
          tar -C "$build_dir" -cf "$GITHUB_WORKSPACE/${{ matrix.packageName }}.tar" .

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.packageName }}
          path: ${{ matrix.packageName }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Restore workspace ownership
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Unity runs in Docker as root and also writes into the action's own folder under
          # _work/_actions, which the runner must delete before the next job can start.
          work="$(readlink -f "$RUNNER_WORKSPACE/..")"
          docker run --rm -v "$work:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w

  build_android:
    name: Build Android ARM64 APK
    needs: [version, engine_tests, regression]
    runs-on: [self-hosted, trusted]
    timeout-minutes: 60

    steps:
      - name: Restore workspace ownership
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Self-hosted workspaces persist between jobs; fix files left by an earlier Unity container.
          work="$(readlink -f "$RUNNER_WORKSPACE/..")"
          docker run --rm -v "$work:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keep Unity's Library folder between jobs on this runner instead of
          # restoring it from the GitHub cache; the next step removes everything else.
          clean: false

      - name: Remove untracked files except Unity Library
        shell: bash
        run: git clean -ffdx -e /Library

      - name: Verify Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: DLSRewired
          buildsPath: build

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Android APK not found"
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$apk" DLSRewired-Android-arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-DLSRewired-Android-arm64
          path: DLSRewired-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Restore workspace ownership
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Unity runs in Docker as root and also writes into the action's own folder under
          # _work/_actions, which the runner must delete before the next job can start.
          work="$(readlink -f "$RUNNER_WORKSPACE/..")"
          docker run --rm -v "$work:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w

  # The WebGL editor image is large; pulling it filled the self-hosted host's Docker
  # disk and killed the other Unity jobs there, so WebGL builds on a GitHub-hosted runner.
  build_webgl:
    name: WebGL (browser)
    needs: [version, engine_tests, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildName: DLSRewired
          buildsPath: build

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" build
          tar -C build/WebGL -cf "$GITHUB_WORKSPACE/DLSRewired-WebGL.tar" .

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: release-DLSRewired-WebGL
          path: DLSRewired-WebGL.tar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build_android, build_webgl]
    # Android is experimental: a failed APK build must not block the desktop release.
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: Docs

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Package desktop builds
        shell: bash
        run: |
          set -euo pipefail
          for archive in release-assets/*.tar; do
            name="$(basename "$archive" .tar)"
            mkdir -p "unpacked/$name"
            tar -xf "$archive" -C "unpacked/$name"
            (cd "unpacked/$name" && zip -qr "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
            rm "$archive"
          done

      - name: Create release and upload files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes_file="Docs/RELEASE_${TAG#v}.md"
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          else
            echo "::warning::$notes_file not found; using generated release notes."
            notes_args=(--generate-notes)
          fi

          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --title "Rewired $TAG" \
              "${notes_args[@]}"
          fi

          assets=(
            release-assets/DLSRewired-Windows-x64.zip
            release-assets/DLSRewired-Linux-x86_64.zip
          )
          if [ -f release-assets/DLSRewired-WebGL.zip ]; then
            assets+=(release-assets/DLSRewired-WebGL.zip)
          else
            echo "::warning::WebGL was not built; publishing without it."
          fi
          if [ -f release-assets/DLSRewired-Android-arm64.apk ]; then
            assets+=(release-assets/DLSRewired-Android-arm64.apk)
          else
            echo "::warning::Android APK was not built; publishing desktop builds only."
          fi

          gh release upload "$TAG" "${assets[@]}" \
            --repo "$REPOSITORY" \
            --clobber
