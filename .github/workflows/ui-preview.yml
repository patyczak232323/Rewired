name: UI preview build

# Builds only the Linux player (and, when asked, the WebGL player) from any branch and
# attaches it to the internal "ui-preview" pre-release, so the interface can be run and
# screenshotted (for example with "-mobile-ui" under Xvfb, or the WebGL build in a headless
# browser) without waiting for every platform.

on:
  workflow_dispatch:
    inputs:
      webgl:
        description: "Also build the WebGL (browser) player"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ui-preview
  cancel-in-progress: true

jobs:
  linux:
    name: Linux preview
    runs-on: [self-hosted, trusted]
    timeout-minutes: 40

    steps:
      - name: Restore workspace ownership
        shell: bash
        run: |
          work="$(readlink -f "$RUNNER_WORKSPACE/..")"
          docker run --rm -v "$work:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Remove untracked files except Unity Library
        shell: bash
        run: git clean -ffdx -e /Library

      - name: Build with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneLinux64
          buildName: DLSRewired
          buildsPath: build

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          tar -C build/StandaloneLinux64 -czf "$GITHUB_WORKSPACE/DLSRewired-Linux-preview.tar.gz" .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-linux
          path: DLSRewired-Linux-preview.tar.gz
          retention-days: 3

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          work="$(readlink -f "$RUNNER_WORKSPACE/..")"
          docker run --rm -v "$work:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w

  # The WebGL editor image is large, so WebGL builds on a GitHub-hosted runner (as in
  # unofficial-build.yml).
  webgl:
    name: WebGL preview
    if: ${{ inputs.webgl }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildName: DLSRewired
          buildsPath: build

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" build
          tar -C build/WebGL -czf "$GITHUB_WORKSPACE/DLSRewired-WebGL-preview.tar.gz" .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-webgl
          path: DLSRewired-WebGL-preview.tar.gz
          retention-days: 3

  publish:
    name: Publish to the ui-preview pre-release
    runs-on: ubuntu-latest
    needs: [linux, webgl]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.webgl.result != 'failure' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-preview-*
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ui-preview
        run: |
          set -euo pipefail
          notes="Internal preview of branch ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}, for UI testing only. Use the android-unofficial or a versioned release instead."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "UI preview (internal)" --notes "$notes"
          fi
          gh release upload "$TAG" DLSRewired-*-preview.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
